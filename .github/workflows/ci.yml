name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Apache and development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 apache2-dev apache2-utils build-essential

      - name: Build module
        run: |
          apxs -c -I. mod_rql.c rql_scoreboard.c
          test -f .libs/mod_rql.so

      - name: Install module
        run: |
          sudo apxs -i -a -n rql mod_rql.la

      - name: Configure test server
        run: |
          sudo a2dismod mpm_event || true
          sudo a2enmod mpm_prefork
          sudo a2enmod cgid
          sudo mkdir -p /var/www/rql-test/cgi-bin
          echo 'OK' | sudo tee /var/www/rql-test/index.html >/dev/null

          sudo sh -c 'cat > /var/www/rql-test/cgi-bin/slow.py' <<'EOF'
          #!/usr/bin/python3
          import time
          print("Content-Type: text/plain")
          print()
          time.sleep(3)
          print("OK")
          EOF
          sudo chmod 755 /var/www/rql-test/cgi-bin/slow.py

          sudo sh -c 'cat > /etc/apache2/sites-available/rql-test.conf' <<'EOF'
          <VirtualHost 127.0.0.1:8080>
              ServerName rql-test
              DocumentRoot /var/www/rql-test

              RQLMaxActiveRequestsPerIP 2

              ScriptAlias /cgi-bin/ /var/www/rql-test/cgi-bin/
              <Directory /var/www/rql-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>

              <Directory /var/www/rql-test>
                  Require all granted
              </Directory>
          </VirtualHost>
          EOF

          sudo sed -i 's/^Listen 80$/Listen 80\nListen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default
          sudo a2ensite rql-test
          sudo apache2ctl configtest

      - name: Start Apache
        run: |
          sudo apache2ctl start
          sleep 1
          curl -fsS http://127.0.0.1:8080/

      - name: ApacheBench basic smoke test
        run: |
          ab -n 20 -c 5 http://127.0.0.1:8080/

      - name: ApacheBench request-limit test
        run: |
          set -o pipefail
          ab -n 20 -c 10 http://127.0.0.1:8080/cgi-bin/slow.py | tee /tmp/ab.txt
          failed=$(awk '/Failed requests:/ {print $3}' /tmp/ab.txt)
          requests=$(awk '/Complete requests:/ {print $3}' /tmp/ab.txt)
          echo "Complete requests: $requests"
          echo "Failed requests: $failed"
          test "$failed" -gt 0

          status_429=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/cgi-bin/slow.py || true)
          echo "Single request after load returned HTTP $status_429"

      - name: Verify module is loaded
        run: |
          apache2ctl -M | grep rql_module
