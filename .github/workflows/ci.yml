name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Apache and development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 apache2-dev apache2-utils build-essential python3

      - name: Build module
        run: |
          apxs -c -I. mod_rql.c rql_scoreboard.c
          test -f .libs/mod_rql.so

      - name: Install module
        run: |
          sudo apxs -i -a -n rql mod_rql.la

      - name: Configure test server
        run: |
          sudo a2dismod mpm_event || true
          sudo a2enmod mpm_prefork
          sudo a2enmod cgid
          sudo mkdir -p /var/www/rql-test/cgi-bin
          echo 'OK' | sudo tee /var/www/rql-test/index.html >/dev/null

          sudo sh -c 'cat > /var/www/rql-test/cgi-bin/slow.py' <<'EOF'
          #!/usr/bin/python3
          import time
          print("Content-Type: text/plain")
          print()
          time.sleep(3)
          print("OK")
          EOF
          sudo chmod 755 /var/www/rql-test/cgi-bin/slow.py

          sudo sh -c 'cat > /var/www/rql-test/cgi-bin/fast.py' <<'EOF'
          #!/usr/bin/python3
          print("Content-Type: text/plain")
          print()
          print("OK")
          EOF
          sudo chmod 755 /var/www/rql-test/cgi-bin/fast.py

          sudo sh -c 'cat > /etc/apache2/sites-available/rql-test.conf' <<'EOF'
          ExtendedStatus On

          <VirtualHost 127.0.0.1:8080>
              ServerName rql-test
              DocumentRoot /var/www/rql-test

              RQLMaxActive 0
              RQLMaxActivePerIP 0
              RQLMaxActivePerVHost 0
              RQLMaxActivePerIPAndVHost 0

              ScriptAlias /cgi-bin/ /var/www/rql-test/cgi-bin/
              <Directory /var/www/rql-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>

              <Directory /var/www/rql-test>
                  Require all granted
              </Directory>
          </VirtualHost>

          <VirtualHost 127.0.0.1:8080>
              ServerName rql-global
              DocumentRoot /var/www/rql-test
              RQLMaxActive 1
              ScriptAlias /cgi-bin/ /var/www/rql-test/cgi-bin/
              <Directory /var/www/rql-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>
              <Directory /var/www/rql-test>
                  Require all granted
              </Directory>
          </VirtualHost>

          <VirtualHost 127.0.0.1:8080>
              ServerName rql-ip
              DocumentRoot /var/www/rql-test
              RQLMaxActivePerIP 1
              ScriptAlias /cgi-bin/ /var/www/rql-test/cgi-bin/
              <Directory /var/www/rql-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>
              <Directory /var/www/rql-test>
                  Require all granted
              </Directory>
          </VirtualHost>

          <VirtualHost 127.0.0.1:8080>
              ServerName rql-vhost-a
              DocumentRoot /var/www/rql-test
              RQLMaxActivePerVHost 1
              ScriptAlias /cgi-bin/ /var/www/rql-test/cgi-bin/
              <Directory /var/www/rql-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>
              <Directory /var/www/rql-test>
                  Require all granted
              </Directory>
          </VirtualHost>

          <VirtualHost 127.0.0.1:8080>
              ServerName rql-vhost-b
              DocumentRoot /var/www/rql-test
              RQLMaxActivePerVHost 1
              ScriptAlias /cgi-bin/ /var/www/rql-test/cgi-bin/
              <Directory /var/www/rql-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>
              <Directory /var/www/rql-test>
                  Require all granted
              </Directory>
          </VirtualHost>

          <VirtualHost 127.0.0.1:8080>
              ServerName rql-ip-vhost-a
              DocumentRoot /var/www/rql-test
              RQLMaxActivePerIPAndVHost 1
              ScriptAlias /cgi-bin/ /var/www/rql-test/cgi-bin/
              <Directory /var/www/rql-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>
              <Directory /var/www/rql-test>
                  Require all granted
              </Directory>
          </VirtualHost>

          <VirtualHost 127.0.0.1:8080>
              ServerName rql-ip-vhost-b
              DocumentRoot /var/www/rql-test
              RQLMaxActivePerIPAndVHost 1
              ScriptAlias /cgi-bin/ /var/www/rql-test/cgi-bin/
              <Directory /var/www/rql-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>
              <Directory /var/www/rql-test>
                  Require all granted
              </Directory>
          </VirtualHost>
          EOF

          sudo sed -i 's/^Listen 80$/Listen 80\nListen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default
          sudo a2ensite rql-test
          sudo apache2ctl configtest

      - name: Start Apache
        run: |
          sudo install -d -o root -g root -m 0755 /var/run/apache2
          sudo service apache2 start
          sleep 1
          curl -fsS -H 'Host: rql-test' http://127.0.0.1:8080/

      - name: Verify module is loaded
        run: |
          apache2ctl -M | grep rql_module

      - name: Test global active-request limit and HTTP 429
        run: |
          set -e
          rm -f /tmp/global-*.code
          for i in 1 2 3 4 5; do
            curl -sS -o /dev/null -w '%{http_code}\n' \
              -H 'Host: rql-global' \
              http://127.0.0.1:8080/cgi-bin/slow.py > /tmp/global-$i.code &
          done
          wait
          cat /tmp/global-*.code
          cat /tmp/global-*.code | grep -qx '200'
          cat /tmp/global-*.code | grep -qx '429'

      - name: Test per-IP active-request limit
        run: |
          set -e
          rm -f /tmp/ip-*.code
          for i in 1 2 3 4 5; do
            curl -sS -o /dev/null -w '%{http_code}\n' \
              -H 'Host: rql-ip' \
              http://127.0.0.1:8080/cgi-bin/slow.py > /tmp/ip-$i.code &
          done
          wait
          cat /tmp/ip-*.code
          cat /tmp/ip-*.code | grep -qx '200'
          cat /tmp/ip-*.code | grep -qx '429'

      - name: Test per-VHost limits independently
        run: |
          set -e
          rm -f /tmp/vhost-*.code
          curl -sS -o /dev/null -w '%{http_code}\n'             -H 'Host: rql-vhost-a'             http://127.0.0.1:8080/cgi-bin/slow.py > /tmp/vhost-a.code &
          pid_a=$!
          curl -sS -o /dev/null -w '%{http_code}\n'             -H 'Host: rql-vhost-b'             http://127.0.0.1:8080/cgi-bin/slow.py > /tmp/vhost-b.code &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          cat /tmp/vhost-*.code
          grep -qx '200' /tmp/vhost-a.code
          grep -qx '200' /tmp/vhost-b.code

      - name: Test per-IP-and-VHost limits independently
        run: |
          set -e
          rm -f /tmp/ip-vhost-*.code
          curl -sS -o /dev/null -w '%{http_code}\n'             -H 'Host: rql-ip-vhost-a'             http://127.0.0.1:8080/cgi-bin/slow.py > /tmp/ip-vhost-a.code &
          pid_a=$!
          curl -sS -o /dev/null -w '%{http_code}\n'             -H 'Host: rql-ip-vhost-b'             http://127.0.0.1:8080/cgi-bin/slow.py > /tmp/ip-vhost-b.code &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          cat /tmp/ip-vhost-*.code
          grep -qx '200' /tmp/ip-vhost-a.code
          grep -qx '200' /tmp/ip-vhost-b.code

      - name: Test keepalive is not counted as active
        run: |
          set -e
          python3 - <<'PY'
          import http.client

          conn = http.client.HTTPConnection("127.0.0.1", 8080)
          headers = {"Host": "rql-ip"}
          conn.request("GET", "/cgi-bin/fast.py", headers=headers)
          first = conn.getresponse()
          first.read()
          assert first.status == 200, first.status

          conn.request("GET", "/cgi-bin/fast.py", headers=headers)
          second = conn.getresponse()
          second.read()
          assert second.status == 200, second.status

          conn.close()
          PY

      - name: ApacheBench basic smoke test
        run: |
          ab -n 20 -c 5 -H 'Host: rql-test' http://127.0.0.1:8080/

      - name: Check Apache error log for unexpected startup errors
        run: |
          sudo tail -n 100 /var/log/apache2/error.log
          ! sudo grep -E '\[emerg\]|\[alert\]' /var/log/apache2/error.log
