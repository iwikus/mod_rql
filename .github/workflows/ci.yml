name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Apache and development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 apache2-dev apache2-utils build-essential python3

      - name: Build module
        run: |
          apxs -c -I. mod_protect.c protect_scoreboard.c protect_rate.c
          test -f .libs/mod_protect.so

      - name: Install module
        run: |
          sudo apxs -i -a -n protect mod_protect.la

      - name: Configure test server
        run: |
          sudo a2dismod mpm_event || true
          sudo a2enmod mpm_prefork
          sudo a2enmod cgid
          sudo mkdir -p /var/www/protect-test/cgi-bin
          echo 'OK' | sudo tee /var/www/protect-test/index.html >/dev/null

          sudo sh -c 'cat > /var/www/protect-test/cgi-bin/slow.py' <<'EOF'
          #!/usr/bin/python3
          import time

          print("Content-Type: text/plain")
          print()
          time.sleep(3)
          print("OK")
          EOF
          sudo chmod 755 /var/www/protect-test/cgi-bin/slow.py

          sudo sh -c 'cat > /var/www/protect-test/cgi-bin/fast.py' <<'EOF'
          #!/usr/bin/python3
          print("Content-Type: text/plain")
          print()
          print("OK")
          EOF
          sudo chmod 755 /var/www/protect-test/cgi-bin/fast.py

          sudo sh -c 'cat > /etc/apache2/sites-available/protect-test.conf' <<'EOF'
          ExtendedStatus On

          <VirtualHost 127.0.0.1:8080>
              ServerName protect-test
              DocumentRoot /var/www/protect-test

              ProtectMaxConcurrentPerIP 0
              ProtectMaxConcurrentPerVHost 0

              ScriptAlias /cgi-bin/ /var/www/protect-test/cgi-bin/
              <Directory /var/www/protect-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>

              <Directory /var/www/protect-test>
                  Require all granted
              </Directory>
          </VirtualHost>

          <VirtualHost 127.0.0.1:8080>
              ServerName protect-ip
              DocumentRoot /var/www/protect-test
              ProtectMaxConcurrentPerIP 1
              ScriptAlias /cgi-bin/ /var/www/protect-test/cgi-bin/
              <Directory /var/www/protect-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>
              <Directory /var/www/protect-test>
                  Require all granted
              </Directory>
          </VirtualHost>

          <VirtualHost 127.0.0.1:8080>
              ServerName protect-vhost-a
              DocumentRoot /var/www/protect-test
              ProtectMaxConcurrentPerVHost 1
              ScriptAlias /cgi-bin/ /var/www/protect-test/cgi-bin/
              <Directory /var/www/protect-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>
              <Directory /var/www/protect-test>
                  Require all granted
              </Directory>
          </VirtualHost>

          <VirtualHost 127.0.0.1:8080>
              ServerName protect-vhost-b
              DocumentRoot /var/www/protect-test
              ProtectMaxConcurrentPerVHost 1
              ScriptAlias /cgi-bin/ /var/www/protect-test/cgi-bin/
              <Directory /var/www/protect-test/cgi-bin>
                  Options +ExecCGI
                  Require all granted
              </Directory>
              <Directory /var/www/protect-test>
                  Require all granted
              </Directory>
          </VirtualHost>

          EOF

          sudo sed -i 's/^Listen 80$/Listen 80\nListen 8080/' /etc/apache2/ports.conf
          sudo a2dissite 000-default
          sudo a2ensite protect-test
          sudo apache2ctl configtest

      - name: Start Apache
        run: |
          sudo install -d -o root -g root -m 0755 /var/run/apache2
          sudo service apache2 start
          sleep 1
          curl -fsS -H 'Host: protect-test' http://127.0.0.1:8080/

      - name: Verify module is loaded
        run: |
          apache2ctl -M | grep protect_module

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --break-system-packages aiohttp

      - name: Test active request limits
        run: |
          python3 - <<'PY'
          import asyncio
          import aiohttp

          TARGET = "http://127.0.0.1:8080/cgi-bin/slow.py"
          N = 21

          async def fire(session, target, start_event, results, idx):
              await start_event.wait()
              try:
                  async with session.get(target) as resp:
                      results[idx] = resp.status
                      await resp.read()
              except Exception as exc:
                  results[idx] = f"ERR: {exc}"

          async def run_scenario(host, n=N):
              start_event = asyncio.Event()
              results = [None] * n

              async with aiohttp.ClientSession(
                  headers={"Host": host},
                  connector=aiohttp.TCPConnector(limit=0),
              ) as session:
                  tasks = [
                      asyncio.create_task(
                          fire(session, TARGET, start_event, results, i)
                      )
                      for i in range(n)
                  ]

                  await asyncio.sleep(0.1)
                  start_event.set()
                  await asyncio.gather(*tasks)

              return results

          async def check(name, host):
              results = await run_scenario(host)
              ok = results.count(200)
              limited = results.count(429)
              other = [r for r in results if r not in (200, 429)]

              print(f"{name}: 200={ok}, 429={limited}, other={other}")

              assert not other, results
              assert 0 < limited < N, results
              assert ok > 0, results

          async def main():
              await check("per-IP", "protect-ip")
              await check("per-VHost A", "protect-vhost-a")
              await check("per-VHost B", "protect-vhost-b")

          asyncio.run(main())
          PY

      - name: Test keepalive is not counted as active
        run: |
          set -e
          python3 - <<'PY'
          import http.client

          conn = http.client.HTTPConnection("127.0.0.1", 8080)
          headers = {"Host": "protect-ip"}
          conn.request("GET", "/cgi-bin/fast.py", headers=headers)
          first = conn.getresponse()
          first.read()
          assert first.status == 200, first.status

          conn.request("GET", "/cgi-bin/fast.py", headers=headers)
          second = conn.getresponse()
          second.read()
          assert second.status == 200, second.status

          conn.close()
          PY

      - name: ApacheBench basic smoke test
        run: |
          ab -n 20 -c 5 -H 'Host: protect-test' http://127.0.0.1:8080/

      - name: Check Apache error log for unexpected startup errors
        run: |
          sudo tail -n 100 /var/log/apache2/error.log
          ! sudo grep -E '\[emerg\]|\[alert\]' /var/log/apache2/error.log
